<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Math Quest</title>
<style>

.btn:hover{filter:brightness(1.15);transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.sec{background:rgba(40,24,90,.85);border:1px solid #8a6cff;box-shadow:none}.btn.on{border-color:var(--c);box-shadow:0 0 16px #5ff0ff66;background:#12425e}
.logo{font-weight:1000;font-size:1.3rem;font-style:italic}.logo b{color:var(--m)}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:8px auto 0}.key{border:1px solid #8a6cff;border-radius:12px;background:#24175a;padding:.9rem 0;font-size:1.3rem;font-weight:900;min-height:48px}.key:active{background:#4a2ba0}.key.w{grid-column:span 3;background:linear-gradient(135deg,var(--c),var(--p));color:#10062e}

.warn{border-color:var(--y);color:var(--y)}

.pods{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:10px 0}.pod{flex:1;max-width:150px;text-align:center;padding:10px 4px;border-radius:14px 14px 0 0}.pod.f{border-color:var(--y);box-shadow:0 0 30px #ffd86b99}
.li{padding:10px;margin:6px 0}.li.you{border-color:var(--c)}.li b:first-child{width:2.2rem}.li span{margin-left:auto;font-weight:900;color:var(--g)}

.sw select,.sw input[type=range],.sw input[type=text]{width:170px;max-width:55%;min-width:0}.sw input[type=range]{accent-color:var(--m)}

.sw input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.sw input[type=checkbox]:checked{background:var(--p)}.sw input[type=checkbox]:checked::after{transform:translateX(22px)}
.sg{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:start}.sn{display:flex;flex-direction:column;gap:8px}.sn .chip{text-align:left;padding:.7rem 1rem;font-size:.95rem}
@media(max-width:640px){.sg{grid-template-columns:1fr}.sn{flex-direction:row;overflow-x:auto;padding-bottom:4px}.sn .chip{white-space:nowrap}}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}.tt{background:#2b145f;border:1px solid var(--m);border-radius:14px;padding:.6rem 1rem;font-weight:900;animation:in .3s}.tt.lv{border-color:var(--y);color:var(--y)}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:2px;background:#0b0624ee;border-top:1px solid #6a4cc8;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}#tabs.h{display:none}
#tabs button{flex:1;max-width:100px;border:0;background:none;border-radius:12px;padding:6px 0;font-size:1.3rem}#tabs button small{display:block;font-size:.55rem}#tabs button.on{background:#3a1f80;box-shadow:0 0 14px var(--m)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}.petal{position:absolute;top:-20px;width:10px;height:14px;background:#ff9bd8;border-radius:80% 0 80% 0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
body.hc{background:#000}body.hc .glass{background:#000;border-color:#fff}body.hc .sm{color:#fff}body.rm *{animation:none!important;transition:none!important}
.bdg{display:inline-block;font-size:.65rem;font-weight:900;letter-spacing:1px;padding:.2rem .55rem;border-radius:10px;vertical-align:middle;border:1px solid}
.bdg.ok{color:var(--g);border-color:var(--g)}.bdg.warn{color:var(--y);border-color:var(--y)}.bdg.bad{color:var(--m);border-color:var(--m)}.bdg.pb{color:var(--c);border-color:var(--c)}.bdg.pv{color:var(--m);border-color:var(--m)}
.visg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vis{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:2px solid #4b3a99;background:rgba(26,16,64,.7);transition:.2s}.vis:hover{transform:translateY(-2px)}.vis .vi{font-size:2rem}.vis small{color:#c9b8ff}.vis.on{border-color:var(--c);box-shadow:0 0 22px #5ff0ff66;background:#12304e}
.codebox{text-align:center;margin-bottom:10px;border-color:var(--m)}.code{font-size:3rem;font-weight:1000;letter-spacing:10px;color:var(--c);text-shadow:0 0 20px var(--c);margin:4px 0}
.cfgg{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:start}
.plg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.rm{animation:pop .4s}.rm.off{opacity:.65}.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:.75rem;color:#c9b8ff}.rg b{display:block;color:#fff;font-size:.95rem}
.empty{grid-column:1/-1;text-align:center;padding:30px}.jerr{min-height:1.4rem;color:var(--m);font-weight:900;margin-bottom:8px}.big2{font-size:2.6rem}
@media(max-width:640px){.visg,.cfgg{grid-template-columns:1fr}.code{font-size:2.4rem;letter-spacing:6px}}
.cnt{display:inline-block;min-width:1.6rem;text-align:center;padding:.1rem .5rem;border-radius:12px;background:#5a1d6e;font-size:.8rem;vertical-align:middle}
.orow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:8px 0;border-radius:16px;background:rgba(90,60,150,.35);border:1px solid rgba(180,130,255,.25);animation:in .3s}.orow.off{opacity:.7}
.oav{width:46px;height:46px;border-radius:50%;background:#6a5aa8;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}.oinfo{flex:1;min-width:150px}.oinfo b{display:block;font-size:1.05rem}.oinfo small{color:#c9b8ff;font-size:.72rem}
.pill{padding:.3rem .8rem;border-radius:20px;font-size:.75rem;font-weight:900;background:#6a1f5e;color:#ffd6f4}.pill.ok{background:#14503a;color:#9bffd0}.pill.warn{background:#5a4510;color:#ffe08a}.pc{font-weight:900}
.mback{position:fixed;inset:0;background:#0b0624d9;display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}.mbox{max-width:420px;width:100%;text-align:center}
</style></head><body><div id="fx"></div><div id="app"></div><nav id="tabs"></nav><div id="toast"></div>
<script>
/* ===== Utilities ===== */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=t=>{const n=new Date(t);return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")},today=()=>ds(Date.now());
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
/* ===== Store (localStorage) ===== */
const Store={d:null,def(){return{name:"Player 1",av:"🎮",id:"MQ-"+Math.random().toString(36).slice(2,8).toUpperCase(),xp:0,games:0,wins:0,ans:0,cor:0,hi:0,best:{},ach:{},runs:[],streak:0,lastClaim:"",daily:{},mruns:[],mset:{time:15,q:10,max:4,lvl:"easy"},set:{sfx:1,vol:.6,rm:0,fx:2,txt:1,hc:0,diff:"easy",dur:120,pad:1}}},
load(){let o=null;try{o=JSON.parse(localStorage.getItem("mq2"))}catch(e){}const d=this.def();if(!o){o={};try{const l=JSON.parse(localStorage.getItem("mathquest-best-by-level")||"{}");for(const k of["easy","medium","hard"])if(l[k])o.best={...o.best,["classic|"+k]:+l[k]}}catch(e){}}this.d={...d,...o,set:{...d.set,...o.set}}},
save(){try{localStorage.setItem("mq2",JSON.stringify(this.d))}catch(e){}}};
/* ===== Audio ===== */
const Snd={ctx:null,play(t){const s=Store.d.set;if(!s.sfx)return;try{const a=this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();if(a.state==="suspended")a.resume();const o=a.createOscillator(),g=a.createGain(),n=a.currentTime,f={good:[660,880],bad:[210,160],ui:[480,520],win:[520,1040]}[t];o.connect(g);g.connect(a.destination);o.type=t==="bad"?"triangle":"sine";o.frequency.setValueAtTime(f[0],n);o.frequency.setValueAtTime(f[1],n+.09);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(Math.max(.0002,.2*s.vol),n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.25);o.start(n);o.stop(n+.26)}catch(e){}}};
/* ===== Question generation (original rules, now seedable) ===== */
const Q={gen(l,r=Math.random){const ri=(a,b)=>a+Math.floor(r()*(b-a+1)),ops=l==="easy"?["+","−"]:["+","−","×"],op=ops[ri(0,ops.length-1)];let a,b;
if(l==="easy"){a=ri(0,10);b=ri(0,10)}else if(l==="medium"){if(op==="×"){a=ri(1,12);b=ri(1,12)}else{a=ri(1,100);b=ri(1,100)}}else{if(op==="×"){a=ri(10,50);b=ri(2,19)}else{a=ri(10,500);b=ri(10,500)}}
if(op==="−"&&b>a)[a,b]=[b,a];return{text:`${a} ${op} ${b} = ?`,ans:op==="+"?a+b:op==="−"?a-b:a*b}},
rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}};
/* ===== XP & achievements ===== */
const XP={lv:x=>Math.floor(Math.sqrt(x/60))+1,base:l=>60*(l-1)**2,pct(x){const l=this.lv(x);return(x-this.base(l))/(this.base(l+1)-this.base(l))*100},
add(n){const d=Store.d,o=this.lv(d.xp);d.xp+=n;const l=this.lv(d.xp);if(l>o){UI.toast("⬆ LEVEL UP! You are level "+l,1);Snd.play("win")}return l>o}};
const ACH=[["math","🧮","Mathematics Master","Answer 100 questions correctly",d=>d.cor>=100],["speed","⚡","Speed Solver","Get 15 correct in Time Attack",(d,g)=>g&&g.mode==="attack"&&g.cor>=15],["perfect","🎯","Perfect Accuracy","10+ correct with no mistakes",(d,g)=>g&&g.cor>=10&&g.wrong===0],["mp","🏆","Multiplayer Champion","Win an online match (needs a server)",d=>d.wins>=1],["daily","📅","Daily Challenger","Complete a daily challenge",(d,g)=>g&&g.mode==="daily"],["streak","🔥","Consistency Streak","Reach a 3-day reward streak",d=>d.streak>=3],["endless","🛡","Endless Survivor","Get 20 correct in Endless Mode",(d,g)=>g&&g.mode==="endless"&&g.cor>=20]];
const Ach={check(g){const d=Store.d;for(const a of ACH)if(!d.ach[a[0]]&&a[4](d,g)){d.ach[a[0]]=Date.now();XP.add(25);UI.toast(a[1]+" Achievement: "+a[2])}}};
const AVS=[["🎮",1],["🦊",1],["🐼",1],["🐲",3],["🦄",5],["🤖",7],["👾",10],["🌸",12]];
const LV={easy:["🌱","EASY","Kindergarten · ages 5–7"],medium:["🚀","MEDIUM","Primary school · ages 8–11"],hard:["🔥","HARD","Advanced · ages 12–15"]};
const MODES={classic:["⏱","Classic Challenge","Beat the clock. +1 correct, −2 wrong."],attack:["⚡","Time Attack","Only 30 seconds. Go fast!"],endless:["♾","Endless Mode","No timer. Game over after 3 mistakes."],survival:["🛡","Survival Challenge","3 lives. Questions get harder as you go."],daily:["📅","Daily Challenge","10 mixed questions, same for everyone today. One attempt."]};
/* ===== Solo game engine ===== */
const Eng={g:null,lock:0,buf:"",iv:0,
start(mode,lvl){const set=Store.d.set,left=mode==="classic"?set.dur:mode==="attack"?30:0;this.g={mode,lvl,score:0,cor:0,wrong:0,n:0,t0:Date.now(),left,tot:left,lives:mode==="endless"||mode==="survival"?3:0,r:mode==="daily"?Q.rng(+today().replace(/-/g,"")):Math.random};this.lock=0;clearInterval(this.iv);UI.go("game");this.next();if(left)this.iv=setInterval(()=>{this.g.left--;this.hud();if(this.g.left<=0)this.end()},1000)},
tier(){const g=this.g;return g.mode==="survival"?(g.cor<5?"easy":g.cor<12?"medium":"hard"):g.mode==="daily"?(g.n<3?"easy":g.n<7?"medium":"hard"):g.lvl},
next(){const g=this.g;g.q=Q.gen(this.tier(),g.r);g.n++;this.buf="";this.lock=0;const q=$("#qt");q.className="prob";q.textContent=g.q.text;$("#in").textContent="…";$("#fb").textContent="";$("#qtag").textContent=LV[this.tier()][0]+" "+LV[this.tier()][1]+" · Q"+g.n;this.hud()},
hud(){const g=this.g;if(!g||!$("#sc"))return;$("#sc").textContent=g.score;$("#bs").textContent=Store.d.best[this.key()]||0;
$("#tm").textContent=g.tot?fmt(Math.max(0,g.left)):g.lives?"❤".repeat(g.lives)+"🖤".repeat(3-g.lives):(g.cor+g.wrong)+"/10";
$("#pb").style.width=(g.tot?g.left/g.tot*100:g.lives?g.lives/3*100:100-(g.cor+g.wrong)*10)+"%"},
key(){const g=this.g;return g.mode+"|"+(g.mode==="daily"?"mixed":g.lvl)},
press(k){if(!this.g||this.lock||this.g.done)return;if(k==="enter")return this.submit();if(k==="clear")this.buf="";else if(k==="back")this.buf=this.buf.slice(0,-1);else if(this.buf.length<7)this.buf+=k;$("#in").textContent=this.buf||"…"},
submit(){if(this.buf==="")return;const g=this.g,good=+this.buf===g.q.ans,q=$("#qt"),fb=$("#fb");this.lock=1;
if(good){g.score++;g.cor++;fb.textContent="🎉 AWESOME! +1";fb.className="fb";q.className="prob good";Snd.play("good")}else{g.score-=2;g.wrong++;if(g.lives)g.lives--;fb.textContent="😅 −2 · Answer: "+g.q.ans;fb.className="fb bad";q.className="prob bad";Snd.play("bad")}
this.hud();const over=(g.lives===0&&g.mode!=="classic"&&g.mode!=="attack"&&g.mode!=="daily")||(g.mode==="daily"&&g.cor+g.wrong>=10);
setTimeout(()=>{if(this.g!==g||g.done)return;over?this.end():this.next()},good?350:750)},
end(){const g=this.g;if(!g||g.done)return;g.done=1;clearInterval(this.iv);g.secs=Math.round((Date.now()-g.t0)/1000);const d=Store.d,k=this.key();g.prev=d.best[k]||0;g.pb=g.score>g.prev&&g.score>0;if(g.pb)d.best[k]=g.score;d.hi=Math.max(d.hi,g.score);d.games++;d.ans+=g.cor+g.wrong;d.cor+=g.cor;
g.xp=g.cor*2+10+(g.mode==="daily"?50:0)+(g.pb?10:0);if(g.mode==="daily")d.daily[today()]=g.score;
d.runs.push({s:g.score,m:g.mode,l:g.mode==="daily"?"mixed":g.lvl,t:Date.now(),n:d.name,a:d.av,lv:XP.lv(d.xp),c:g.cor,w:g.wrong});d.runs=d.runs.slice(-200);g.up=XP.add(g.xp);Ach.check(g);Store.save();UI.go("results",g,1)}};
/* ===== Multiplayer: transport adapter + demo server =====
 Set window.MQ_SERVER_URL="wss://…" before this script to use a real server.
 Client→server: {t:"create"|"quick",settings} {t:"join",room} {t:"settings",room,settings:{time,q,max,lvl}} {t:"start",room} {t:"ans",room,round,v} {t:"leave"} {t:"rejoin",room}  (all also carry id,name,av)
 Server→client: {t:"room",code,you,host,settings,players:[{id,name,av}]} {t:"start"} {t:"q",round,total,text,ends(ms epoch),time}
                {t:"reveal",answer,gains:{id:pts},scores:{id:n}} {t:"end",ranking:[{id,score}]} {t:"err",msg}
 Scoring is server-side: points = 8 × full seconds left when a correct answer arrives (112 at best on 15 s), else 0.
 The server holds answers; the client never sees the correct answer until "reveal". */
const Net={url:window.MQ_SERVER_URL||"",ws:null,q:[],
open(){this.ws=new WebSocket(this.url);this.ws.onmessage=e=>{try{MP.onMsg(JSON.parse(e.data))}catch(x){}};this.ws.onopen=()=>{this.q.splice(0).forEach(m=>this.ws.send(JSON.stringify(m)));if(MP.sub)this.send({t:"publicRooms"})};this.ws.onclose=()=>{if(MP.active&&MP.token)setTimeout(()=>{this.open();this.send({t:"rejoin",room:MP.room,token:MP.token})},2000);else if(MP.sub)setTimeout(()=>this.open(),2000)}},
send(m){const d=Store.d;m.id=d.id;m.name=d.name;m.av=d.av;if(!this.url)return Demo.recv(m);if(!this.ws||this.ws.readyState>1)this.open();this.ws.readyState===1?this.ws.send(JSON.stringify(m)):this.q.push(m)}};
const Demo={st:null,
cl(){const s=this.st;clearTimeout(this.tm);clearTimeout(this.rt);(s&&s.bts||[]).forEach(clearTimeout)},
stop(){this.cl();this.st=null},

scores(){const d=Store.d,f=UI.f,mp=f.type==="mp",chip=(k,v,t)=>`<button class="chip ${f[k]===v?"on":""}" data-act="flt" data-k="${k}" data-v="${v}">${t}</button>`,
ro=(x,i)=>`<div class="glass li row ${x.you?"you":""}"><b>${i==null?"—":"#"+(i+1)}</b>${x.a} <b>${esc(x.n)}</b><small>Lv ${x.lv}</small>${x.sub?`<small>${x.sub}</small>`:""}<span>${x.s}</span></div>`,
rows=(mp?d.mruns.map(x=>({...x,sub:x.demo?"vs bots":x.pl+" players"+(x.win?" · won":"")})):d.runs.map(x=>({...x,sub:MODES[x.m][1]+" · "+x.l}))).map(x=>({...x,you:1})).sort((a,b)=>b.s-a.s).slice(0,10),
st=(i,t,v)=>`<div class="glass card st">${i} ${t}<b>${v}</b></div>`;let body;
if(f.tab==="local"){const pod=rows.slice(0,3),ord=[1,0,2].filter(i=>pod[i]),bm=m=>Math.max(0,...Object.entries(d.best).filter(([k])=>k.startsWith(m+"|")).map(e=>e[1]));
body=`<p class="sm">Saved on this device only.</p><h3>🥇 Personal best</h3><div class="grid g3">${mp?st("🏆","BEST MATCH SCORE",rows[0]?rows[0].s:0)+st("🎮","MATCHES PLAYED",d.mruns.length)+st("👑","ONLINE WINS",d.mruns.filter(x=>x.win&&!x.demo).length):Object.entries(MODES).map(([k,v])=>st(v[0],v[1].split(" ")[0].toUpperCase(),bm(k))).join("")}</div><h3>Top results</h3>`+(rows.length?`<div class="pods">${ord.map(i=>`<div class="glass pod ${i===0?"f":""}" style="height:${[150,120,100][i]}px"><div style="font-size:1.6rem">${i===0?"👑":["","🥈","🥉"][i]}</div><div style="font-size:1.8rem">${pod[i].a}</div><b>${esc(pod[i].n)}</b><div style="color:var(--g);font-weight:900">${pod[i].s}</div></div>`).join("")}</div>`+rows.map(ro).join(""):`<p class="sm">No ${mp?"multiplayer":"solo"} results yet. Play a game!</p>`)}
else{const mine=rows[0]?[{...rows[0],n:d.name+" (you)",sub:"not synced"}]:[];body=`<div class="glass card warn">${f.tab==="global"?"Global":"Friends"} rankings need a backend with accounts, which isn’t connected. Other players will appear here once it is. Until then this shows only your own best ${mp?"multiplayer":"solo"} result.</div><h3 style="margin-top:12px">${f.tab==="global"?"🌍 Global":"👥 Friends"} · ${mp?"Multiplayer":"Solo"}</h3>`+(mine.length?mine.map(x=>ro(x,null)).join(""):`<p class="sm">Nothing to show yet.</p>`)}
return head("High Scores")+`<div class="row" style="margin-bottom:8px">${chip("tab","local","📱 This device")}${chip("tab","global","🌍 Global")}${chip("tab","friends","👥 Friends")}</div><div class="row" style="margin-bottom:10px">${chip("type","solo","🎯 Solo")}${chip("type","mp","⚔ Multiplayer")}</div>`+body},
profile(){const d=Store.d,l=XP.lv(d.xp),acc=d.ans?Math.round(d.cor/d.ans*100):0,st=[["🎮","Games",d.games],["🏆","Wins",d.wins],["❓","Questions",d.ans],["🎯","Accuracy",acc+"%"],["🥇","Highest",d.hi],["🔥","Streak",d.streak]];
return head("Profile")+`<div class="glass card row"><div class="av" style="font-size:3.5rem">${d.av}</div><div style="flex:1"><h2>${esc(d.name)}</h2><div class="sm">ID ${d.id} · Level ${l} · Rank ${["Rookie","Challenger","Expert","Master","Legend"][Math.min(4,Math.floor((l-1)/3))]}</div><div class="bar"><i data-w="${XP.pct(d.xp)}"></i></div><div class="sm">${d.xp} total XP · ${XP.base(l+1)-d.xp} to next level</div></div></div><h3>Statistics</h3><div class="grid g3">${st.map(s=>`<div class="glass card st">${s[0]} ${s[1].toUpperCase()}<b>${s[2]}</b></div>`).join("")}</div><h3>Avatar</h3><div class="row">${AVS.map(a=>`<button class="btn sec ${a[0]===d.av?"on":""}" data-act="avatar" data-v="${a[0]}" style="font-size:1.6rem" ${l<a[1]?'title="Unlocks at level '+a[1]+'"':""}>${l<a[1]?"🔒":a[0]}<small style="display:block;font-size:.6rem">${l<a[1]?"Lv "+a[1]:""}</small></button>`).join("")}</div><h3 id="achs">Achievements</h3><div class="grid g3">${ACH.map(a=>`<div class="glass ach ${d.ach[a[0]]?"on":""}"><b>${a[1]} ${a[2]}</b><div class="sm">${a[3]}<br>${d.ach[a[0]]?"✔ Unlocked":"🔒 Locked"}</div></div>`).join("")}</div>`},
settings(){const d=Store.d,c=UI.sc,cats=[["audio","🔊","Audio"],["look","🎨","Appearance"],["play","🎮","Gameplay"],["access","♿","Accessibility"],["acct","👤","Account"]],
P={audio:sw("sfx","Sound effects")+`<label class="sw">Volume<input type="range" min="0" max="1" step=".05" value="${d.set.vol}" data-set="vol"></label>`,
look:sel("fx","Background effects",[[0,"Off"],[1,"Low"],[2,"High"]])+sw("rm","Reduced motion"),
play:sel("diff","Default difficulty",[["easy","Easy"],["medium","Medium"],["hard","Hard"]],1)+sel("dur","Classic duration",[[60,"1 min"],[120,"2 min"],[300,"5 min"],[600,"10 min"]])+sw("pad","On-screen keypad"),
access:sel("txt","Text size",[[.9,"Small"],[1,"Normal"],[1.2,"Large"],[1.4,"Extra large"]])+sw("hc","High contrast")+`<p class="sm">Keyboard: digits, Backspace, Enter.</p>`,
acct:`<label class="sw">Username<input type="text" id="nm" maxlength="14" value="${esc(d.name)}"></label><div class="row" style="margin-top:12px"><button class="btn sec" data-go="profile">Change avatar</button><button class="btn sec" data-act="reset">Reset progress</button></div>`};
return head("Settings")+`<div class="sg"><nav class="sn">${cats.map(x=>`<button class="chip ${x[0]===c?"on":""}" data-act="cat" data-v="${x[0]}">${x[1]} ${x[2]}</button>`).join("")}</nav><div class="glass card"><h3>${cats.find(x=>x[0]===c)[1]} ${cats.find(x=>x[0]===c)[2]}</h3>${P[c]}</div></div>`
}};
/* ===== UI, navigation, settings ===== */
const UI={st:[["menu"]],cur:"menu",sc:"audio",cfg:null,busy:0,f:{tab:"local",type:"solo"},
go(n,a,rep){if(rep)this.st[this.st.length-1]=[n,a];else if(n==="menu")this.st=[["menu"]];else this.st.push([n,a]);this.show()},
back(){if(this.st.length>1)this.st.pop();this.show()},
show(){const[n,a]=this.st[this.st.length-1];if(MP.room&&n!=="mpwait"&&n!=="mpgame")MP.leave();if(MP.sub&&n!=="mp"){MP.sub=0;Net.send({t:"unsub"})}this.cur=n;$("#app").innerHTML=`<section class="scr">${V[n](a)}</section>`;if(n==="mp"){MP.sub=1;MP.renderPub();Net.send({t:"publicRooms"})}requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"));
const t={menu:"menu",solo:"solo",results:"solo",mp:"mp",mpwait:"mp",mpcfg:"mp",scores:"scores",profile:"profile",settings:"settings"}[n];$("#tabs").className=t?"":"h";$("#tabs").innerHTML=[["menu","🏠","Home"],["solo","🎯","Solo"],["mp","⚔","Versus"],["scores","🏆","Scores"],["profile","👤","Profile"],["settings","⚙","Settings"]].map(x=>`<button class="${x[0]===t?"on":""}" data-act="tab" data-v="${x[0]}" aria-label="${x[2]}">${x[1]}<small>${x[2]}</small></button>`).join("");window.scrollTo(0,0)},
toast(m,lv){const e=document.createElement("div");e.className="tt"+(lv?" lv":"");e.textContent=m;$("#toast").appendChild(e);setTimeout(()=>e.remove(),2600)},
apply(){const s=Store.d.set,rm=s.rm||matchMedia("(prefers-reduced-motion: reduce)").matches;document.documentElement.style.setProperty("--ts",s.txt);document.body.classList.toggle("hc",!!s.hc);document.body.classList.toggle("rm",!!rm);const fx=$("#fx");fx.innerHTML="";const n=rm?0:[0,8,18][s.fx];for(let i=0;i<n;i++){const p=document.createElement("span");p.className="petal";p.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*15}s;transform:scale(${.6+Math.random()*.8})`;fx.appendChild(p)}}};
const A={back:()=>UI.back(),
tab:e=>{UI.st=[["menu"]];e.dataset.v!=="menu"&&UI.st.push([e.dataset.v]);UI.show();Snd.play("ui")},
achs(){UI.go("profile");setTimeout(()=>{const e=$("#achs");e&&e.scrollIntoView({behavior:"smooth"})},60)},
cat(e){UI.sc=e.dataset.v;UI.go("settings",null,1);Snd.play("ui")},
snd(){Store.d.set.sfx^=1;Store.save();UI.show();Snd.play("ui")},
diff(e){Store.d.set.diff=e.dataset.v;Store.save();UI.go("solo",null,1);Snd.play("ui")},
play(e){Eng.start(e.dataset.v,e.dataset.l||Store.d.set.diff)},
daily(){Store.d.daily[today()]!==undefined?UI.toast("Already completed today. Come back tomorrow!"):Eng.start("daily","mixed")},
quit(){clearInterval(Eng.iv);Eng.g=null;UI.back()},
key(e){(MP.active&&UI.cur==="mpgame"?MP:Eng).press(e.dataset.k)},
claim(){const d=Store.d;if(d.lastClaim===today())return;d.streak=d.lastClaim===ds(Date.now()-864e5)?d.streak+1:1;d.lastClaim=today();const x=20+Math.min(d.streak,7)*10;XP.add(x);UI.toast("🎁 +"+x+" XP · "+d.streak+"-day streak");Ach.check(null);Store.save();Snd.play("win");UI.go("menu",null,1)},
quick(){Net.send({t:"quick",settings:{lvl:Store.d.set.diff}})},create(){UI.go("mpcfg")},vis(e){UI.cfg.vis=e.dataset.v;Store.d.mset.vis=e.dataset.v;Store.save();UI.go("mpcfg",null,1);Snd.play("ui")},
docreate(e){if(UI.busy)return;const c=UI.cfg;UI.busy=1;e.disabled=true;setTimeout(()=>{UI.busy=0;const b=$("#cbtn");if(b)b.disabled=false},5000);Net.send({t:"create",visibility:c.vis,settings:{time:c.time,q:c.q,max:c.max,lvl:c.lvl}})},
refresh(){Net.send({t:"publicRooms"});UI.toast("Refreshing…")},
joinpriv(){$("#mdl").innerHTML='<div class="mback" onclick="if(event.target===this)A.mclose()"><div class="glass card mbox"><div class="big2">🔒</div><h3>Private room</h3><p class="sm">Enter the 4-character room code from the host.</p><input type="text" id="rc" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,\'\')" onkeydown="if(event.key===\'Enter\')A.join()" style="width:100%;font-size:2rem;text-align:center;letter-spacing:8px;margin:6px 0"><div id="jerr" class="jerr"></div><div class="row" style="justify-content:center"><button class="btn" data-act="join">JOIN ROOM</button><button class="btn sec" data-act="mclose">Cancel</button></div></div></div>';setTimeout(()=>{const i=$("#rc");if(i)i.focus()},40)},
mclose(){$("#mdl").innerHTML=""},joinpub(e){Net.send({t:"joinPublic",room:e.dataset.v})},
copy(e){const t=e.dataset.v,ok=()=>UI.toast("Room code copied: "+t),fb=()=>{const x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(_){UI.toast("Copy failed. Code: "+t)}x.remove()};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb()},
start(){Net.send({t:"start",room:MP.room})},addbot(){Net.send({t:"addbot",room:MP.room})},
join(){const i=$("#rc");if(!i)return;const c=i.value.trim().toUpperCase(),j=$("#jerr");if(j)j.textContent="";if(c.length<4){const m="Enter the 4-character room code.";if(j)j.textContent=m;return UI.toast(m)}Net.send({t:"join",room:c})},
mpquit(){UI.back()},
flt(e){UI.f[e.dataset.k]=e.dataset.v;UI.go("scores",null,1)},
avatar(e){const d=Store.d,a=AVS.find(x=>x[0]===e.dataset.v);if(XP.lv(d.xp)<a[1])return UI.toast("Unlocks at level "+a[1]);d.av=a[0];Store.save();UI.go("profile",null,1)},
reset(){if(confirm("Reset ALL local progress, scores and settings?")){localStorage.removeItem("mq2");localStorage.removeItem("mathquest-best-by-level");Store.load();UI.apply();UI.go("menu")}}};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)return UI.go(g.dataset.go),Snd.play("ui");const a=e.target.closest("[data-act]");if(a&&!a.disabled)A[a.dataset.act](a)});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.set;if(k){Store.d.set[k]=t.type==="checkbox"?+t.checked:t.dataset.str?t.value:+t.value;Store.save();UI.apply();if(k==="vol")Snd.play("good")}});
document.addEventListener("change",e=>{const cf=e.target.dataset.cfg;if(cf&&UI.cfg){const v=cf==="lvl"?e.target.value:+e.target.value;UI.cfg[cf]=v;Store.d.mset[cf]=v;Store.save()}const k=e.target.dataset.mset;if(k){const v=k==="lvl"?e.target.value:+e.target.value;Store.d.mset[k]=v;Store.save();Net.send({t:"settings",room:MP.room,settings:{[k]:v}})}if(e.target.id==="nm"){Store.d.name=e.target.value.trim().slice(0,14)||"Player 1";Store.save();UI.toast("Username saved")}});
document.addEventListener("keydown",e=>{if(e.target.matches("input,select"))return;const T=UI.cur==="game"?Eng:UI.cur==="mpgame"?MP:null;if(!T)return;if(/^\d$/.test(e.key))T.press(e.key);else if(e.key==="Backspace")T.press("back");else if(e.key==="Enter")T.press("enter")});
Store.load();UI.apply();UI.show();
</script></body></html>
