back(){if(this.st.length>1)this.st.pop();this.show()},
show(){const[n,a]=this.st[this.st.length-1];if(MP.room&&n!=="mpwait"&&n!=="mpgame")MP.leave();if(MP.sub&&n!=="mp"){MP.sub=0;Net.send({t:"unsub"})}this.cur=n;$("#app").innerHTML=`<section class="scr">${V[n](a)}</section>`;if(n==="mp"){MP.sub=1;MP.renderPub();Net.send({t:"publicRooms"})}if(n==="scores"&&UI.f.tab==="prog"){Prog.renderLb();if(Net.url)Net.send({t:"leaderboard",cat:UI.f.pcat||"level"})}if(UI.postHook){const f=UI.postHook;UI.postHook=null;setTimeout(f,60)}requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"));
const t={menu:"menu",solo:"solo",results:"solo",mp:"mp",mpwait:"mp",mpcfg:"mp",scores:"scores",profile:"profile",settings:"settings"}[n];$("#tabs").className=t?"":"h";$("#tabs").innerHTML=[["menu","🏠","Home"],["solo","🎯","Solo"],["mp","⚔","Versus"],["scores","🏆","Scores"],["profile","👤","Profile"],["settings","⚙","Settings"]].map(x=>`<button class="${x[0]===t?"on":""}" data-act="tab" data-v="${x[0]}" aria-label="${x[2]}">${x[1]}<small>${x[2]}</small></button>`).join("");window.scrollTo(0,0)},
toast(m,lv){const e=document.createElement("div");e.className="tt"+(lv?" lv":"");e.textContent=m;$("#toast").appendChild(e);setTimeout(()=>e.remove(),2600)},
apply(){const s=Store.d.set,rm=s.rm||matchMedia("(prefers-reduced-motion: reduce)").matches;document.documentElement.style.setProperty("--ts",s.txt);document.body.classList.toggle("hc",!!s.hc);document.body.classList.toggle("rm",!!rm);const fx=$("#fx");fx.innerHTML="";const n=rm?0:[0,8,18][s.fx];for(let i=0;i<n;i++){const p=document.createElement("span");p.className="petal";p.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*15}s;transform:scale(${.6+Math.random()*.8})`;fx.appendChild(p)}}};
const A={back:()=>UI.back(),
tab:e=>{UI.st=[["menu"]];e.dataset.v!=="menu"&&UI.st.push([e.dataset.v]);UI.show();Snd.play("ui")},
achs(){UI.go("profile");setTimeout(()=>{const e=$("#achs");e&&e.scrollIntoView({behavior:"smooth"})},60)},
cat(e){UI.sc=e.dataset.v;UI.go("settings",null,1);Snd.play("ui")},
snd(){Store.d.set.sfx^=1;Store.save();UI.show();Snd.play("ui")},
diff(e){Store.d.set.diff=e.dataset.v;Store.save();UI.go("solo",null,1);Snd.play("ui")},
play(e){Eng.start(e.dataset.v,e.dataset.l||Store.d.set.diff)},
daily(){(Prog.P&&Prog.P.daily.lastChallenge===utc())||Store.d.daily[today()]!==undefined?UI.toast("Already completed today. Come back tomorrow!"):Eng.start("daily","mixed")},
quit(){clearInterval(Eng.iv);if(Eng.g&&Eng.g.srv)Net.send({t:"soloQuit"});Eng.g=null;UI.back()},
key(e){(MP.active&&UI.cur==="mpgame"?MP:Eng).press(e.dataset.k)},
claim(){if(!Net.url)return UI.toast("Daily rewards need the game server.");Net.send({t:"claim"})},
quick(){Net.send({t:"quick",settings:{lvl:Store.d.set.diff}})},create(){UI.go("mpcfg")},vis(e){UI.cfg.vis=e.dataset.v;Store.d.mset.vis=e.dataset.v;Store.save();UI.go("mpcfg",null,1);Snd.play("ui")},
docreate(e){if(UI.busy)return;const c=UI.cfg;UI.busy=1;e.disabled=true;setTimeout(()=>{UI.busy=0;const b=$("#cbtn");if(b)b.disabled=false},5000);Net.send({t:"create",visibility:c.vis,settings:{time:c.time,q:c.q,max:c.max,lvl:c.lvl}})},
refresh(){Net.send({t:"publicRooms"});UI.toast("Refreshing…")},
pst(e){UI.pst=e.dataset.v;UI.go("profile",null,1)},acat(e){UI.acat=e.dataset.v;UI.go("profile",null,1)},
ainspect(e){const df=Prog.def(e.dataset.v),P=Prog.P;if(!df)return;const s=P?P.achievements[df.id]:{tier:0,value:0},t=s.tier,n=df.milestones.length,look=t?df.look[t-1]:df.look[0],eqd=P&&P.equipped.includes(df.id),C=Prog.cfg;
Modal.show(`<div style="text-align:center"><div class="abx big">${achBadge(df.cat,look,df.icon,150,!t)}</div><h2>${esc(df.name)}</h2><div class="sm">${C.categories.find(c=>c.id===df.cat).label} · ${t?"Tier "+t+"/"+n+" · "+C.tierNames[look-1]:"Locked"}</div><div class="sm">Progress: <b>${fmtN(s.value)}</b>${t>=n?" (completed)":" / "+fmtN(df.milestones[t])}</div></div>${df.milestones.map((m,i)=>`<div class="mrow${i<t?" got":""}"><span>${i<t?"✅":"🔒"} Tier ${i+1} · ${C.tierNames[df.look[i]-1]}</span><span>${descFor(df,m)}</span><b>+${df.rewards[i]} XP</b></div>`).join("")}<div class="row" style="justify-content:center;margin-top:10px">${t?`<button class="btn" data-act="equip" data-v="${df.id}">${eqd?"Unequip badge":"Equip badge"}</button>`:""}<button class="btn sec" onclick="Modal.hide()">Close</button></div>`)},
equip(e){const P=Prog.P;if(!P)return;let ids=P.equipped.slice();const id=e.dataset.v;if(ids.includes(id))ids=ids.filter(x=>x!==id);else{if(ids.length>=3)return UI.toast("You can equip up to 3 badges.");ids.push(id)}Net.send({t:"equip",ids});Modal.hide();UI.toast("Badges updated")},
synccode(){UI.showSync=!UI.showSync;UI.go("profile",null,1)},
copysync(){const a=Prog.auth;if(!a)return;const t=a.id+"."+a.secret,ok=()=>UI.toast("Sync code copied");navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,()=>UI.toast("Copy failed")):UI.toast("Copy not available")},
restore(){const v=(($("#syncin")||{}).value||"").trim(),i=v.indexOf(".");if(i<1)return UI.toast("That doesn’t look like a sync code.");Prog.saveAuth({id:v.slice(0,i),secret:v.slice(i+1)});Prog.P=null;try{Net.ws.onclose=null;Net.ws.close()}catch(x){}Net.q=[];Net.open();UI.toast("Restoring your account…")},
joinpriv(){$("#mdl").innerHTML='<div class="mback" onclick="if(event.target===this)A.mclose()"><div class="glass card mbox"><div class="big2">🔒</div><h3>Private room</h3><p class="sm">Enter the 4-character room code from the host.</p><input type="text" id="rc" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,\'\')" onkeydown="if(event.key===\'Enter\')A.join()" style="width:100%;font-size:2rem;text-align:center;letter-spacing:8px;margin:6px 0"><div id="jerr" class="jerr"></div><div class="row" style="justify-content:center"><button class="btn" data-act="join">JOIN ROOM</button><button class="btn sec" data-act="mclose">Cancel</button></div></div></div>';setTimeout(()=>{const i=$("#rc");if(i)i.focus()},40)},
mclose(){$("#mdl").innerHTML=""},joinpub(e){Net.send({t:"joinPublic",room:e.dataset.v})},
copy(e){const t=e.dataset.v,ok=()=>UI.toast("Room code copied: "+t),fb=()=>{const x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(_){UI.toast("Copy failed. Code: "+t)}x.remove()};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb()},
start(){Net.send({t:"start",room:MP.room})},addbot(){Net.send({t:"addbot",room:MP.room})},
join(){const i=$("#rc");if(!i)return;const c=i.value.trim().toUpperCase(),j=$("#jerr");if(j)j.textContent="";if(c.length<4){const m="Enter the 4-character room code.";if(j)j.textContent=m;return UI.toast(m)}Net.send({t:"join",room:c})},
mpquit(){UI.back()},
flt(e){UI.f[e.dataset.k]=e.dataset.v;UI.go("scores",null,1)},
avatar(e){const d=Store.d,a=AVATAR_COLLECTION.find(x=>x.id===String(e.dataset.v||"noob"));if(!a)return;const idx=Prog.idx();if(idx<a.requiredLevel)return UI.toast("Unlocks at level "+a.requiredLevel+" ("+Prog.lvls()[a.requiredLevel-1].id+")");d.avatar=a.id;d.av=a.icon;Store.save();if(Net.url&&Net.ws&&Net.ws.readyState===1)Net.send({t:"setAvatar",avatar:a.id});else if(Net.url)Net.q.push({t:"setAvatar",avatar:a.id});UI.toast("Avatar equipped: "+a.name);UI.go("profile",null,1)}, 
reset(){if(confirm("Reset ALL local progress, scores and settings?")){localStorage.removeItem("mq2");localStorage.removeItem("mathquest-best-by-level");Store.load();UI.apply();UI.go("menu")}}};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)return UI.go(g.dataset.go),Snd.play("ui");const a=e.target.closest("[data-act]");if(a&&!a.disabled)A[a.dataset.act](a)});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.set;if(k){Store.d.set[k]=t.type==="checkbox"?+t.checked:t.dataset.str?t.value:+t.value;Store.save();UI.apply();if(k==="vol")Snd.play("good")}});
document.addEventListener("change",e=>{const cf=e.target.dataset.cfg;if(cf&&UI.cfg){const v=cf==="lvl"?e.target.value:+e.target.value;UI.cfg[cf]=v;Store.d.mset[cf]=v;Store.save()}const k=e.target.dataset.mset;if(k){const v=k==="lvl"?e.target.value:+e.target.value;Store.d.mset[k]=v;Store.save();Net.send({t:"settings",room:MP.room,settings:{[k]:v}})}if(e.target.id==="nm"){Store.d.name=e.target.value.trim().slice(0,14)||"Player 1";Store.save();if(Net.url)Net.send({t:"setName",name:Store.d.name});UI.toast("Username saved")}});
document.addEventListener("keydown",e=>{if(e.target.matches("input,select"))return;const T=UI.cur==="game"?Eng:UI.cur==="mpgame"?MP:null;if(!T)return;if(/^\d$/.test(e.key))T.press(e.key);else if(e.key==="Backspace")T.press("back");else if(e.key==="Enter")T.press("enter")});
Store.load();Prog.loadAuth();UI.apply();UI.show();if(Net.url)Net.open();
</script></body></html>
